<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20232B"/>
      <stop offset="100%" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E5E9F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F26D63"/>
      <stop offset="100%" stop-color="#D94236"/>
    </linearGradient>
  </defs>

  <!-- App squircle container -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="#2E323E" stroke-width="3"/>

  <!-- Folded study page / document -->
  <path d="M66 50
           H145
           L185 90
           V190
           A16 16 0 0 1 169 206
           H66
           A16 16 0 0 1 50 190
           V66
           A16 16 0 0 1 66 50 Z"
        fill="url(#page)"/>

  <!-- Dog-ear page fold -->
  <path d="M145 50 V78 A12 12 0 0 0 157 90 H185 Z" fill="#C2CAD6"/>

  <!-- Minimalist structured note lines -->
  <rect x="72" y="84" width="52" height="12" rx="6" fill="#B5BECA"/>
  <rect x="72" y="110" width="82" height="12" rx="6" fill="#C9D0DA"/>
  <rect x="72" y="136" width="44" height="12" rx="6" fill="#C9D0DA"/>

  <!-- Signature Coral-Red Flow Checkmark Badge -->
  <circle cx="162" cy="166" r="46" fill="#16181E"/>
  <circle cx="162" cy="166" r="39" fill="url(#accent)"/>
  <path d="M143 166 L156 179 L183 151"
        fill="none"
