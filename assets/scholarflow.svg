<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Warm Coral-to-Amber upper flow ribbon -->
    <linearGradient id="warmFlow" x1="0.12" y1="0.15" x2="0.88" y2="0.78">
      <stop offset="0%" stop-color="#FFA366"/>
      <stop offset="50%" stop-color="#F25244"/>
      <stop offset="100%" stop-color="#D42A4C"/>
    </linearGradient>

    <!-- Cool Indigo-to-Cyan lower flow ribbon -->
    <linearGradient id="coolFlow" x1="0.12" y1="0.85" x2="0.88" y2="0.18">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="52%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Smooth radial violet-magenta glow where ribbons meet -->
    <radialGradient id="foldGlow" cx="0.32" cy="0.68" r="0.45">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Smooth soft shadow under the upper ribbon crossing -->
    <linearGradient id="ribbonShadow" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#090D16" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="orbClip">
      <circle cx="128" cy="128" r="106"/>
    </clipPath>

    <clipPath id="lowerRibbonClip">
      <path d="M 30 156
               C 50 202, 94 234, 146 234
               C 202 234, 234 190, 234 134
               C 234 102, 214 78, 186 72
               C 188 122, 152 162, 102 168
               C 72 172, 46 164, 30 156 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#orbClip)">
    <!-- Lower cool ribbon (tucked cleanly behind upper ribbon on the left) -->
    <path d="M 30 156
             C 50 202, 94 234, 146 234
             C 202 234, 234 190, 234 134
             C 234 102, 214 78, 186 72
             C 188 122, 152 162, 102 168
             C 72 172, 46 164, 30 156 Z"
          fill="url(#coolFlow)"/>

    <!-- Seamless depth shadow & radial violet fold glow clipped to lower ribbon -->
    <g clip-path="url(#lowerRibbonClip)">
      <path d="M 20 144
               C 62 174, 134 176, 198 104
               C 220 82, 240 90, 244 120
               C 186 196, 76 204, 20 168 Z"
            fill="url(#ribbonShadow)"/>
      <rect x="22" y="22" width="212" height="212" fill="url(#foldGlow)"/>
    </g>

    <!-- Upper warm ribbon -->
    <path d="M 234 110
             C 212 58, 164 22, 110 22
             C 54 22, 22 66, 22 122
             C 22 154, 42 178, 70 184
             C 68 134, 104 94, 154 88
             C 188 84, 216 96, 234 110 Z"
          fill="url(#warmFlow)"/>

    <!-- Subtle top-edge sheen -->
    <path d="M 38 112
             C 44 64, 78 34, 122 34
             C 162 34, 196 54, 218 88"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity="0.22"
          stroke-width="4"
          stroke-linecap="round"/>
  </g>
</svg>
